
name: Build v2rayNG

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-ng.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build hev-socks5-tunnel
        run: |
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          bash compile-hevtun.sh

      - name: Copy hev lib
        shell: bash
        run: |
          mkdir -p V2rayNG/app/libs

          FOUND=$(find . -type f -name "libhev-socks5-tunnel.so" -not -path "./V2rayNG/*")

          if [ -z "$FOUND" ]; then
            echo "ERROR: libhev-socks5-tunnel.so not found"
            find . -type f -name "*.so" -not -path "./V2rayNG/*" | head -50
            exit 1
          fi

          while IFS= read -r f; do
            abi=$(basename "$(dirname "$f")")
            echo "Copy $f to V2rayNG/app/libs/$abi"
            mkdir -p "V2rayNG/app/libs/$abi"
            cp "$f" "V2rayNG/app/libs/$abi/"
          done <<< "$FOUND"

          find V2rayNG/app/libs -type f

      - name: Prepare geo files
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="V2rayNG/app/src/main/assets"
          mkdir -p "$ASSETS"

          echo "--- Source references ---"
          grep -rn "geoip-only-cn-private" V2rayNG/app/src/main \
            --include="*.kt" \
            --include="*.json" \
            --include="*.xml" | head -20 || true

          echo "--- Copy existing geo files ---"

          for f in geoip.dat geosite.dat; do
            if [ -f "AndroidLibXrayLite/assets/$f" ]; then
              cp -f "AndroidLibXrayLite/assets/$f" "$ASSETS/$f"
            fi
          done

          echo "--- Download missing geo files ---"

          if [ ! -s "$ASSETS/geoip.dat" ]; then
            curl -fL --retry 3 \
              -o "$ASSETS/geoip.dat" \
              https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          fi

          if [ ! -s "$ASSETS/geosite.dat" ]; then
            curl -fL --retry 3 \
              -o "$ASSETS/geosite.dat" \
              https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          fi

          if [ ! -s "$ASSETS/geoip-only-cn-private.dat" ]; then
            curl -fL --retry 3 \
              -o "$ASSETS/geoip-only-cn-private.dat" \
              https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip-only-cn-private.dat
          fi

          echo "--- Final geo files ---"
          ls -lh "$ASSETS"

          for f in geoip.dat geosite.dat geoip-only-cn-private.dat; do
            test -s "$ASSETS/$f" || {
              echo "ERROR: $f is missing or empty"
              exit 1
            }
          done

      - name: Build libv2ray
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export PATH=$PATH:$HOME/go/bin

          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

          gomobile init

          cd AndroidLibXrayLite
          go mod tidy

          gomobile bind -v -androidapi 24 -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            -o libv2ray.aar ./

          mkdir -p ../V2rayNG/app/libs
          cp libv2ray.aar ../V2rayNG/app/libs/

      - name: Build APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleFdroidDebug

      - name: Check native libs and geo files in APK
        shell: bash
        run: |
          APK=$(find V2rayNG/app/build/outputs/apk/fdroid/debug -name "*arm64*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          echo "Checking APK: $APK"

          CONTENTS=$(unzip -Z1 "$APK")

          echo "--- Native libraries ---"
          echo "$CONTENTS" | grep "\.so" || true

          echo "$CONTENTS" | grep -q "libhev-socks5-tunnel.so" || {
            echo "ERROR: libhev missing in APK"
            exit 1
          }

          echo "--- Geo files ---"

          for f in geoip.dat geosite.dat geoip-only-cn-private.dat; do
            echo "$CONTENTS" | grep -Fxq "assets/$f" || {
              echo "ERROR: $f missing in APK"
              exit 1
            }
            echo "OK: $f"
          done

          echo "SUCCESS: Native and geo files verified"

      - name: Publish APKs to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SUFFER VPN Build ${{ github.run_number }}
          files: "V2rayNG/app/build/outputs/apk/fdroid/debug/*arm64*.apk"
          fail_on_unmatched_files: true
          
