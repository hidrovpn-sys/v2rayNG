name: Build v2rayNG
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-ng.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build hev-socks5-tunnel
        run: bash compile-hevtun.sh
      - name: Build libv2ray
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          cd AndroidLibXrayLite
          go mod tidy
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid=' -o libv2ray.aar ./
          mkdir -p ../V2rayNG/app/libs
          cp libv2ray.aar ../V2rayNG/app/libs/
      - name: Build APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "V2rayNG/app/build/outputs/apk/**/*arm64*.apk"
