
name: Build v2rayNG

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/build-ng.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build hev-socks5-tunnel
        run: |
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME
          bash compile-hevtun.sh

      - name: Build libv2ray
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          export PATH=$PATH:$HOME/go/bin

          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

          gomobile init

          cd AndroidLibXrayLite
          go mod tidy

          gomobile bind -v -androidapi 24 -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            -o libv2ray.aar ./

          mkdir -p ../V2rayNG/app/libs
          cp libv2ray.aar ../V2rayNG/app/libs/

      - name: Build APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleFdroidDebug

      - name: Verify APK signatures
        shell: bash
        run: |
          APK_DIR="V2rayNG/app/build/outputs/apk/fdroid/debug"

          mapfile -t APK_FILES < <(find "$APK_DIR" -type f -name "*.apk")

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No APK files found!"
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found!"
            exit 1
          fi

          echo "Using: $APKSIGNER"

          for apk in "${APK_FILES[@]}"; do
            echo "--------------------------------"
            echo "Checking: $apk"

            "$APKSIGNER" verify --verbose --print-certs "$apk"

            if [ $? -ne 0 ]; then
              echo "ERROR: APK signature verification failed!"
              exit 1
            fi

            sha256sum "$apk"
            echo "APK signature is valid."
          done

      - name: Publish APKs to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SUFFER VPN Build ${{ github.run_number }}
          files: "V2rayNG/app/build/outputs/apk/fdroid/debug/*.apk"
          fail_on_unmatched_files: true
          
